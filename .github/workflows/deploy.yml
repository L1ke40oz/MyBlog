# 推到 main 就自动构建 + 上传到 VPS。
#
# 跟开发文档里那份 Vue 的比，改了三处：
#   1. 用 SSH 密钥而不是 root 密码（密码放在 GitHub 里风险高，密钥可以随时单独吊销）
#   2. 用 rsync --delete 而不是 scp（删掉的日记，线上会真的消失；scp 只会往上堆）
#   3. 锁 Node 版本 + 开 npm 缓存，构建结果可复现、也快一点
#
# 需要在仓库里配 4 个 secret：Settings → Secrets and variables → Actions
#   SERVER_HOST      VPS 的**真实公网 IP**。不要填域名 —— blog.luminestella.top
#                    解析到的是 Cloudflare 的 IP，而 Cloudflare 只代理 HTTP(S)，
#                    不转发 SSH，填域名必然连不上。
#   SERVER_PORT      SSH 端口，一般是 22
#   SERVER_USER      登录用户名（要对下面 DEPLOY_PATH 那个目录有写权限）
#   SSH_PRIVATE_KEY  私钥全文，从 -----BEGIN 到 -----END 那一整段都要，而且不能带口令
#
# 换域名的话，下面的 DEPLOY_PATH 也要跟着改。
#
# 上传失败的时候不用去猜 exit code：下面每个前置检查失败都会自己说明原因
#（哪个 secret 没配、私钥读不出来、端口不通、公钥没进 authorized_keys、
#  目录不存在、没有写权限、服务器上没装 rsync）。

name: 构建并部署博客

on:
  push:
    branches: [main]
  workflow_dispatch: # 也允许在 Actions 页面上手动点一次

# 同一分支上只跑最后一次，避免两次部署撞在一起把目录写坏
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 只需要读代码，不给多余权限

env:
  # 这里要填**宿主机上的真实路径** —— SSH 登进服务器 ls 能看到的那个，
  # 而不是 nginx 配置里那行 root。1Panel 的 OpenResty 跑在容器里，
  # 容器内的 /www 挂的是宿主机的 /opt/1panel/www，所以两边写法本来就不一样：
  #   nginx（容器内看到的）：/www/sites/blog.luminestella.top/index
  #   rsync（宿主机上真实的）：/opt/1panel/www/sites/blog.luminestella.top/index
  # 换域名、或者 1Panel 装在别的目录，用这条命令核对真实路径：
  #   find / -maxdepth 7 -type d -path '*www/sites/blog.luminestella.top*'
  DEPLOY_PATH: /opt/1panel/www/sites/blog.luminestella.top/index

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # checkout / setup-node 用 v6 而不是 v4：v4 是给已经废弃的 Node 20 打包的，
      # runner 现在会强制它们跑在 Node 24 上，并且每次都打一条 deprecation 警告。
      # 那条警告只是噪音，不影响构建 —— 但没必要一直看着。
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 装 Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 检查一下部署路径改过了没
        run: |
          case "${DEPLOY_PATH}" in
            "" | *example.com*)
              echo "::error::DEPLOY_PATH 还是占位的 example.com，先在 .github/workflows/deploy.yml 里改成你的域名再推。"
              echo "::error::这一步是故意卡住的 —— 路径写错的话，下面的 rsync --delete 会删错东西。"
              exit 1
              ;;
          esac

      - name: 检查 4 个 secret 配没配
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          if [ -z "$SERVER_HOST" ]; then missing="$missing SERVER_HOST"; fi
          if [ -z "$SERVER_PORT" ]; then missing="$missing SERVER_PORT"; fi
          if [ -z "$SERVER_USER" ]; then missing="$missing SERVER_USER"; fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then missing="$missing SSH_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::这几个 secret 是空的，或者名字打错了：$missing"
            echo "::error::去仓库 Settings → Secrets and variables → Actions → New repository secret 补上，名字必须一模一样。"
            exit 1
          fi
          echo "4 个 secret 都在。"

      - name: 准备 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # tr -d '\r'：私钥大概率是从 Windows 上复制粘贴进 secret 的，很可能夹着 \r，
          # OpenSSH 会直接说格式非法。正常私钥里不该有 \r，删掉是安全的。
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 先看形状。这几个判断只看开头结尾和行数，不会把私钥内容打出来，
          # 但足够指出到底是哪一种粘错 —— 光说「读不出来」帮不上忙。
          lines=$(grep -c '' ~/.ssh/deploy_key)

          if ! grep -q -- '-----BEGIN' ~/.ssh/deploy_key; then
            first_word=$(head -1 ~/.ssh/deploy_key | cut -d' ' -f1)
            case "$first_word" in
              ssh-rsa | ssh-ed25519 | ecdsa-sha2-*)
                echo "::error::这个 secret 里放的是**公钥**（开头是 ${first_word}），不是私钥。"
                echo "::error::公钥是带 .pub 后缀那个文件，它该放到服务器的 ~/.ssh/authorized_keys 里；"
                echo "::error::GitHub 这个 secret 要的是**没有 .pub 后缀**的那个文件（cat ~/.ssh/blog_deploy）。"
                ;;
              *)
                echo "::error::这个 secret 里找不到 -----BEGIN 那一行，内容不像是一个私钥文件。"
                echo "::error::在服务器上跑 cat ~/.ssh/blog_deploy，把输出整段复制进来。"
                ;;
            esac
            exit 1
          fi

          if ! grep -q -- '-----END' ~/.ssh/deploy_key; then
            echo "::error::有 -----BEGIN 但没有 -----END，私钥被截断了 —— -----END 那一行也要复制进去。"
            exit 1
          fi

          if [ "$lines" -lt 4 ]; then
            echo "::error::私钥只有 ${lines} 行，换行丢了、被拼成了一行。私钥必须保持原样的多行结构。"
            echo "::error::从网页终端（1Panel 的终端、云厂商控制台）里复制多行文本经常出这个问题。"
            exit 1
          fi

          # 形状对了，再让 ssh-keygen 真读一遍。
          # -P "" 加上 </dev/null：带口令的私钥当场失败，而不是卡在等人输入口令。
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key < /dev/null > ~/.ssh/deploy_key.pub 2>/tmp/keyerr; then
            echo "::error::私钥的头尾都在（共 ${lines} 行），但 OpenSSH 读不出来。两种情况："
            echo "::error::1) 中间的内容缺了行 / 多了空格 —— 复制的时候被网页终端折行或截断了。"
            echo "::error::2) 这把私钥设了口令 —— CI 没法交互输入，重新生成时用 -N \"\" 把口令留空。"
            sed 's/^/::error::ssh-keygen: /' /tmp/keyerr
            exit 1
          fi
          echo "私钥能读。它对应的公钥是下面这行（公钥不是秘密，可以公开）："
          cat ~/.ssh/deploy_key.pub
          echo "→ 登录用户的 ~/.ssh/authorized_keys 里必须有这一行，登不上的时候先对这个。"

          # 记下服务器指纹，这样下一步可以开着严格校验，不用 StrictHostKeyChecking=no
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > ~/.ssh/known_hosts 2>/tmp/scanerr || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::连指纹都取不到，说明网络层就没通，还没走到密钥那一步。按可能性从高到低查："
            echo "::error::1) SERVER_HOST 填成了域名。blog.luminestella.top 解析到的是 Cloudflare 的 IP，"
            echo "::error::   Cloudflare 只代理 HTTP(S)，不转发 SSH。这里要填 VPS 的真实公网 IP。"
            echo "::error::2) SERVER_PORT 不对（有些装机脚本会把 SSH 挪到别的端口）。"
            echo "::error::3) 云厂商安全组 / 服务器防火墙没把这个端口对外放开。"
            sed 's/^/  ssh-keyscan: /' /tmp/scanerr
            exit 1
          fi
          echo "拿到服务器指纹了，端口是通的。"

      - name: 试一下能不能登录、目录在不在
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 注意用 $HOME 而不是 ~：波浪号放进变量里是不会被展开的。
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${SERVER_PORT} -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes"
          TARGET="${SERVER_USER}@${SERVER_HOST}"

          if ! $SSH "$TARGET" true 2>/tmp/ssherr; then
            echo "::error::端口是通的，但这把密钥登不上去 —— 问题在密钥或用户名这一环："
            echo "::error::1) 公钥没进 authorized_keys，或者进错了用户的家目录。SERVER_USER 填的是谁，"
            echo "::error::   公钥就得在那个用户的 ~/.ssh/authorized_keys 里（上一步已经把公钥打出来了，对一下）。"
            echo "::error::2) 权限太开放，OpenSSH 会直接拒绝：chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys"
            echo "::error::3) SERVER_USER 写错了。"
            sed 's/^/  ssh: /' /tmp/ssherr
            exit 1
          fi
          echo "登录成功。"

          # rsync 不会帮你创建目标目录的父目录，先确认它在。
          if ! $SSH "$TARGET" "test -d '${DEPLOY_PATH}'"; then
            echo "::error::能登录，但服务器上没有 ${DEPLOY_PATH} 这个目录。"
            echo "::error::别照抄 nginx 配置里那行 root —— OpenResty 在容器里，它看到的 /www"
            echo "::error::是宿主机的 /opt/1panel/www 挂进去的，rsync 要的是宿主机那一侧的路径。"
            echo "::error::登上服务器跑这条命令，看真实路径是哪个，再改本文件 env 里的 DEPLOY_PATH："
            echo "::error::  find / -maxdepth 7 -type d -path '*www/sites/*'"
            exit 1
          fi

          if ! $SSH "$TARGET" "test -w '${DEPLOY_PATH}'"; then
            echo "::error::目录在，但登录用户对 ${DEPLOY_PATH} 没有写权限。"
            echo "::error::要么把 SERVER_USER 换成有权限的用户，要么在服务器上把这个目录的属主改成它。"
            exit 1
          fi

          if ! $SSH "$TARGET" "command -v rsync >/dev/null 2>&1"; then
            echo "::error::服务器上没装 rsync —— 上传靠的就是它。Ubuntu/Debian：apt install -y rsync"
            exit 1
          fi
          echo "目录存在、可写，rsync 也在。可以上传了。"

      - name: 上传到 VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # dist 后面那个斜杠很重要：传的是 dist 里的内容，不是 dist 这个目录本身
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${SERVER_PORT} -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes" \
            dist/ "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"

      - name: 收尾
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub
