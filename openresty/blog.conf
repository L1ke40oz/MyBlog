# OpenResty / nginx 配置片段 —— 静态博客用
#
# 【贴在哪】1Panel → 网站 → 点你的域名 → 配置文件，把下面的内容贴进已有的
#           server { ... } 里面（不是外面）。listen / server_name / root / SSL
#           这些 1Panel 已经生成好了，不要再写一遍。
#
# 【⚠ 先做一件事】如果配置里已经有一个 location / { ... }（比如照 Vue 那套教程
#           加过 try_files $uri $uri/ /index.html;），**要把它删掉**，不能留两个。
#           nginx 遇到两个 location / 会直接拒绝启动（duplicate location "/"）。
#           而且那条 /index.html 的写法是给 Vue 单页应用的：这个博客是多页静态站，
#           照抄的结果是所有打错的网址都会变成首页，而不是 404。
#
# 【怎么验】改完在服务器上先测再重载，别直接 reload：
#           openresty -t && openresty -s reload
#           （1Panel 界面上点"保存"其实也会先测，报错会弹出来。）

index index.html;

# --- gzip ---------------------------------------------------------------
# text/html 默认就会压，不用也不能写进 gzip_types。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# --- 带 hash 的构建产物 -------------------------------------------------
# /_astro/ 下的文件名里带内容 hash，内容一改文件名就变，所以可以让浏览器永久缓存。
# 这是整套缓存策略里最省事也最划算的一条。
location /_astro/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

# --- 图片、图标、字体 ---------------------------------------------------
# 这些文件名里没有 hash（比如 /favicon.svg），所以只缓存 30 天，不能 immutable。
location ~* \.(?:svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
}

# --- 页面本体 -----------------------------------------------------------
location / {
    # HTML 不能缓存：否则发了新日记，回头客还拿着旧的那一份。
    add_header Cache-Control "no-cache" always;

    # $uri      /favicon.svg 这种直接命中文件
    # $uri/     /diary/xxx/ 命中目录，再由 index 交给里面的 index.html
    # $uri.html 少打了结尾斜杠的 /diary/xxx 也能开
    # =404      最后一档必须是 =404，不能写成 /404.html ——
    #           try_files 的最后一项如果是个 URI，nginx 会用 200 把它发出去，
    #           等于所有找不到的页面都"成功"了。交给下面的 error_page 才是真 404。
    try_files $uri $uri/ $uri.html =404;
}

# --- 自定义 404 ---------------------------------------------------------
# Astro 把它构建成 dist/404.html，所以这里就是根目录下的 /404.html。
error_page 404 /404.html;
location = /404.html {
    internal; # 只允许内部跳转过来，直接访问 /404.html 也是 404，符合预期
    add_header Cache-Control "no-cache" always;
}

# --- 顺手挡一下 ---------------------------------------------------------
location ~ /\. {
    deny all;
    access_log off;
}

# 说明：没有写 charset utf-8; 是故意的。
# 页面自己带 <meta charset="utf-8">，够了；而 1Panel 生成的配置里如果已经有一条
# charset，再加一条 nginx 会报 "charset directive is duplicate" 起不来。
# 确定原本没有、又想加的话，把下面这行的 # 去掉：
# charset utf-8;
