# blog.luminestella.top —— 1Panel 里那份配置 + 博客需要的几段，合并好的完整版
#
# 【怎么用】1Panel → 网站 → blog.luminestella.top → 配置文件，
#           把编辑框里的内容**全选删掉**，然后把这个文件的内容整段贴进去，保存。
#
# 【和你原来那份的区别】原样保留了你原来的每一行（listen / server_name / index /
#           日志 / 两条安全规则 / acme / root / error_page），只在末尾追加了
#           「博客加的」那一段。你原来没有 location /，所以不用删任何东西。
#
# 【验证】保存前 1Panel 会自己跑一次 nginx -t，有错会弹出来。
#         想自己在服务器上确认一遍：openresty -t && openresty -s reload
#
# 【⚠ 以后要注意】在 1Panel 里申请证书、开 HTTPS、改 HTTP 跳转，面板有可能
#         重新生成这个文件，把下面「博客加的」那一段冲掉。改完证书回来看一眼
#         这一段还在不在；不在就把这个文件再贴一次。

server {
    listen 80 ;
    server_name blog.luminestella.top;
    index index.php index.html index.htm default.php default.htm default.html;
    access_log /www/sites/blog.luminestella.top/log/access.log main;
    error_log /www/sites/blog.luminestella.top/log/error.log;
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }
    root /www/sites/blog.luminestella.top/index;
    error_page 404 /404.html;

    # ======================================================================
    # ↓↓↓ 以下是博客加的，上面的都是 1Panel 原来就有的 ↓↓↓
    # ======================================================================

    # --- gzip ---------------------------------------------------------
    # text/html 默认就会压，不用也不能写进 gzip_types。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- 带 hash 的构建产物 -------------------------------------------
    # /_astro/ 下的文件名里带内容 hash，内容一改文件名就变，所以可以让浏览器
    # 永久缓存。这是整套缓存策略里最省事也最划算的一条。
    #
    # ^~ 这两个字符不能少：nginx 的匹配顺序里，正则 location 比普通前缀
    # location 优先，下面那条按扩展名匹配的正则会把 /_astro/xxx.webp 抢走，
    # 照片墙的图就只剩 30 天缓存了。^~ 的意思是「前缀命中就别再试正则」。
    location ^~ /_astro/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # --- 图片、图标、字体 ---------------------------------------------
    # 这些文件名里没有 hash（比如 /favicon.svg），所以只缓存 30 天。
    location ~* \.(?:svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # --- 页面本体 -----------------------------------------------------
    location / {
        # HTML 不能缓存：否则发了新日记，回头客还拿着旧的那一份。
        add_header Cache-Control "no-cache" always;

        # $uri      /favicon.svg 这种直接命中文件
        # $uri/     /diary/xxx/ 命中目录，再由 index 交给里面的 index.html
        # $uri.html 少打了结尾斜杠的 /diary/xxx 也能开
        # =404      最后一档必须是 =404，不能写成 /404.html ——
        #           try_files 的最后一项如果是个 URI，nginx 会用 200 把它发
        #           出去，等于所有找不到的页面都「成功」了。交给上面那条
        #           error_page 才是真 404。
        try_files $uri $uri/ $uri.html =404;
    }

    # --- 自定义 404 ---------------------------------------------------
    # 上面 1Panel 那行 error_page 404 /404.html; 指到的就是这里。
    # Astro 把 404 页构建成 dist/404.html，rsync 上来就在根目录。
    location = /404.html {
        internal; # 只允许内部跳转过来，直接访问 /404.html 也是 404
        add_header Cache-Control "no-cache" always;
    }

    # --- 顺手挡一下 ---------------------------------------------------
    # 挡掉以点开头的路径。这条**不会**挡掉签证书用的
    # /.well-known/acme-challenge/：上面那条 acme 写的是 ^~ 前缀匹配，
    # ^~ 命中之后 nginx 就不再试任何正则，所以这条轮不到。
    location ~ /\. {
        deny all;
        access_log off;
    }

    # 说明：没有写 charset utf-8; 是故意的。页面自己带 <meta charset="utf-8">
    # 就够了；而这一条重复是致命的，nginx 会报 charset directive is duplicate
    # 直接起不来。别加。
}
